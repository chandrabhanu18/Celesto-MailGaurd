[project]
name = "mailguard"
version = "0.1.0"
description = "Security-First AI Communication Gatekeeper with Celesto Sandbox"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celesto==0.1.4",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.35",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
