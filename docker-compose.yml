services:
  ledger:
    image: postgres:16-alpine
    container_name: mailguard-ledger
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    volumes:
      - ./seeds:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mailguard-api
    ports:
      - "8080:8080"
    environment:
      - CELESTO_PROVIDER=cloud
      - CELESTO_API_KEY=${CELESTO_API_KEY:-}
      - CELESTO_BACKEND=firecracker
      - LLM_PROVIDER=mock
      - LLM_BASE_URL=https://example-llm-host/v1
      - LLM_API_KEY=replace-me
      - LLM_MODEL=replace-with-a-model-name
      - DATABASE_URL=postgresql://ledger:ledger@ledger:5432/ledger
      - API_PORT=8080
      - HOST=0.0.0.0
      - PORT=8080
    depends_on:
      ledger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
